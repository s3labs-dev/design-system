<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3 Labs Email Signature - Compact</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 20px; background-color: #f5f5f5;">

<!-- EMAIL SIGNATURE START - Compact Version -->
<table cellpadding="0" cellspacing="0" border="0" style="font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.4; color: #333333;">
  <tr>
    <td>
      <!-- Name & Title Row -->
      <p style="margin: 0 0 4px 0; padding: 0;">
        <span style="font-size: 16px; font-weight: 600; color: #1a1f16;">Your Name</span>
        <span style="color: #d4a574; padding: 0 6px;">|</span>
        <span style="font-size: 14px; font-weight: 400; color: #6a7858;">Your Title</span>
      </p>

      <!-- Contact Row -->
      <p style="margin: 0 0 8px 0; padding: 0; font-size: 13px; color: #4a5942;">
        <a href="mailto:your.email@s3labs.io" style="color: #5cb842; text-decoration: none;">your.email@s3labs.io</a>
        <span style="color: #d4a574; padding: 0 4px;">·</span>
        <span>+1 (555) 123-4567</span>
        <span style="color: #d4a574; padding: 0 4px;">·</span>
        <a href="https://s3labs.io" style="color: #4ad9d0; text-decoration: none;">s3labs.io</a>
      </p>

      <!-- Logo & Company -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-top: 8px; border-top: 1px solid #e8e4db; padding-top: 8px;">
        <tr>
          <td style="padding-top: 8px; vertical-align: middle;">
            <img
              src="https://your-domain.com/brand/logos/png/s3-logo-mark.png"
              alt="S3 Labs"
              width="28"
              height="33"
              style="display: inline-block; vertical-align: middle; border: 0; width: 28px; height: auto;"
            >
            <span style="vertical-align: middle; padding-left: 8px; font-size: 14px;">
              <span style="font-weight: 700; color: #1a1f16;">s3</span><span style="font-weight: 300; color: #1a1f16;">labs</span>
            </span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<!-- EMAIL SIGNATURE END -->

</body>
</html>
