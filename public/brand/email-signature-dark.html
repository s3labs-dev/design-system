<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3 Labs Email Signature - Dark Theme</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 20px; background-color: #0d100b;">

<!-- EMAIL SIGNATURE START - Dark Theme (Solarpunk) -->
<table cellpadding="0" cellspacing="0" border="0" style="font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.5; background-color: #141912; border-radius: 8px; padding: 16px;">
  <tr>
    <td style="padding: 16px;">
      <table cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="padding-right: 20px; vertical-align: top;">
            <!-- Logo Mark -->
            <img
              src="https://your-domain.com/brand/logos/png/s3-logo-mark.png"
              alt="S3 Labs"
              width="60"
              height="71"
              style="display: block; border: 0; width: 60px; height: auto;"
            >
          </td>
          <td style="vertical-align: top; border-left: 2px solid #7ed957; padding-left: 16px;">
            <!-- Name with brand color -->
            <p style="margin: 0 0 2px 0; padding: 0;">
              <span style="font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; color: #f5f1e8; letter-spacing: -0.01em;">
                Your Name
              </span>
            </p>

            <!-- Title -->
            <p style="margin: 0 0 10px 0; padding: 0;">
              <span style="font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; color: #6a7858;">
                Your Title
              </span>
            </p>

            <!-- Contact Info -->
            <p style="margin: 0; padding: 0; font-size: 13px;">
              <a href="mailto:your.email@s3labs.io" style="color: #7ed957; text-decoration: none;">your.email@s3labs.io</a>
              <span style="color: #d4a574; padding: 0 6px;">|</span>
              <span style="color: #6a7858;">+1 (555) 123-4567</span>
            </p>

            <!-- Website -->
            <p style="margin: 4px 0 0 0; padding: 0; font-size: 13px;">
              <a href="https://s3labs.io" style="color: #5ffbf1; text-decoration: none; font-weight: 500;">s3labs.io</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<!-- EMAIL SIGNATURE END -->

</body>
</html>
